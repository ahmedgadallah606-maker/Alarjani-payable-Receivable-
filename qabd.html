:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#ddd8cc;--acc:#0f6b4f;--accink:#fff;--wa:#1faa59;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--ink:#f1efe8;--mute:#a09d92;--line:#37352f;--acc:#3fb88f;--accink:#0b1f18;--wa:#2fc56e;--danger:#f2b8b5}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--ink:#f1efe8;--mute:#a09d92;--line:#37352f;--acc:#3fb88f;--accink:#0b1f18;--wa:#2fc56e;--danger:#f2b8b5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 8px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
input[type=range]{padding:0;height:28px;accent-color:var(--acc);border:0;background:transparent}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
.amt{font-size:26px;font-weight:700;text-align:center}
details{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:4px 12px;background:var(--card)}
summary{padding:10px 0;font-weight:700;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--mute);margin:6px 0 2px;line-height:1.6}
.paper{margin-top:18px;border-radius:10px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.25);background:#fff;line-height:0}
.paper canvas{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.paper canvas.stm{touch-action:none;cursor:grab}
.paper canvas.drag{cursor:grabbing}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;font:inherit;font-weight:700;font-size:16px;padding:13px 8px;border:0;border-radius:12px;text-align:center;text-decoration:none;cursor:pointer;background:var(--acc);color:var(--accink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{flex:none;font-size:14px;padding:10px 14px}
.btn.del{color:var(--danger);border-color:var(--danger)}
.msg{text-align:center;color:var(--mute);font-size:14px;min-height:20px;margin-top:8px}
#out{display:none;width:100%;margin-top:10px;border-radius:10px;border:1px solid var(--line)}
.sl{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:8px;margin:6px 0;font-size:14px;color:var(--mute)}
.sl b{color:var(--ink);font-weight:700;text-align:left;direction:ltr;font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:6px;justify-content:center;margin:12px 0;direction:ltr}
.pad button{font:inherit;font-size:20px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--acc);color:var(--accink)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .c{grid-column:2;grid-row:2;font-size:13px}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.srow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
@page{size:A5 landscape;margin:0}
@media print{html,body{background:#fff}main{max-width:none;padding:0}main>*:not(.paper){display:none!important}.paper{margin:0;border-radius:0;box-shadow:none;width:210mm;height:148mm}.paper canvas{width:210mm;height:148mm}}
</style>
</head>
<body>
<main>
<a href="index.html" style="display:inline-block;margin:0 0 6px;font-size:15px;color:var(--mute);text-decoration:none">→ القائمة الرئيسية</a>
<h1>سند قبض</h1>
<label for="from">استلمنا من المكرم</label>
<input id="from" autocomplete="off" placeholder="الاسم">
<label for="amt">المبلغ بالريال</label>
<input id="amt" class="amt" inputmode="decimal" autocomplete="off" placeholder="0">
<label for="note">وذلك عن</label>
<textarea id="note" rows="2" placeholder="مثال: الدفعة الأولى من ..."></textarea>
<details id="d1">
<summary>بيانات إضافية (المحاسب، المستلم، شيك، التاريخ)</summary>
<div class="two">
<div><label for="acc">المحاسب</label><input id="acc" autocomplete="off"></div>
<div><label for="rec">المستلم</label><input id="rec" autocomplete="off"></div>
</div>
<label for="cash">نقداً / شيك رقم</label><input id="cash" autocomplete="off" placeholder="نقداً">
<div class="two">
<div><label for="bank">على بنك</label><input id="bank" autocomplete="off"></div>
<div><label for="cdate">بتاريخ (الشيك) — لو فاضي = تاريخ السند</label><input id="cdate" type="date"></div>
</div>
<div class="two">
<div><label for="vdate">تاريخ السند (ميلادي)</label><input id="vdate" type="date"></div>
<div><label for="hdate">التاريخ الهجري (اختياري)</label><input id="hdate" autocomplete="off" placeholder="تلقائي"></div>
</div>
<label for="num">رقم السند</label><input id="num" inputmode="numeric" autocomplete="off">
</details>
<details id="d2">
<summary>ختم الشركة</summary>
<div class="srow">
<label class="btn sm" id="stUp" style="position:relative;overflow:hidden;margin:0">رفع صورة الختم<input id="stFile" type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;margin:0;border:0;font-size:0;cursor:pointer"></label>
<button type="button" class="btn sm ghost del" id="stDel">حذف الختم</button>
</div>
<div class="hint" id="stHint">ارفع صورة الختم (بخلفية بيضاء أو شفافة) وستُزال الخلفية تلقائياً. ثم اسحب الختم إلى مكانه على السند بإصبعك، أو استخدم الأسهم للتحريك بالملّي.</div>
<label style="display:flex;gap:8px;align-items:center;margin:10px 0 0;color:var(--ink)"><input type="checkbox" id="stOn" checked> إظهار الختم على هذا السند</label>
<div class="sl"><span>الحجم</span><input type="range" id="stSize" min="15" max="80" step="1"><b id="vSize"></b></div>
<div class="sl"><span>الدوران</span><input type="range" id="stRot" min="-45" max="45" step="1"><b id="vRot"></b></div>
<div class="sl"><span>الوضوح</span><input type="range" id="stOpa" min="30" max="100" step="1"><b id="vOpa"></b></div>
<div class="sl"><span>إزالة الخلفية</span><input type="range" id="stBg" min="0" max="100" step="1"><b id="vBg"></b></div>
<div class="pad" id="pad">
<button type="button" class="u" data-dx="0" data-dy="-1" aria-label="أعلى">▲</button>
<button type="button" class="l" data-dx="-1" data-dy="0" aria-label="يسار">◀</button>
<button type="button" class="c" id="stReset" title="إعادة الختم لمكانه الأصلي">إعادة</button>
<button type="button" class="r" data-dx="1" data-dy="0" aria-label="يمين">▶</button>
<button type="button" class="d" data-dx="0" data-dy="1" aria-label="أسفل">▼</button>
</div>
<div class="hint" style="text-align:center">كل ضغطة = 1 مم</div>
</details>

<div class="paper"><canvas id="cv" width="2520" height="1776" aria-label="معاينة سند القبض"></canvas></div>

<div class="row"><button class="btn" id="shr">إرسال / مشاركة صورة السند</button></div>
<div class="row"><button class="btn ghost" id="pdf">تنزيل PDF</button><button class="btn ghost" id="img">تنزيل صورة</button></div>
<div class="row">
<button class="btn ghost" id="prn">طباعة</button>
<a class="btn wa" id="wa" target="_blank" rel="noopener">واتساب (نص)</a>
<button class="btn ghost" id="new">سند جديد</button>
</div>
<div class="msg" id="msg"></div>
<div id="res"></div>
<img id="out" alt="سند القبض">
</main>
<script>
/* ===== أدوات عامة ===== */
var $=function(i){return document.getElementById(i)};
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function sdel(k){try{localStorage.removeItem(k)}catch(e){}}
function pad(x){return String(x).padStart(2,"0")}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ===== المبلغ بالحروف (تفقيط) ===== */
var OM=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
var OF=["","واحدة","اثنتان","ثلاث","أربع","خمس","ست","سبع","ثماني","تسع","عشر","إحدى عشرة","اثنتا عشرة","ثلاث عشرة","أربع عشرة","خمس عشرة","ست عشرة","سبع عشرة","ثماني عشرة","تسع عشرة"];
var TN=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
var HN=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
function grp(n,fem){
 var O=fem?OF:OM,h=Math.floor(n/100),r=n%100,p=[];
 if(h)p.push(HN[h]);
 if(r){if(r<20)p.push(O[r]);else{var t=Math.floor(r/10),u=r%10;p.push(u?O[u]+" و"+TN[t]:TN[t])}}
 return p.join(" و")}
function scale(n,one,two,few,many,s,last){
 if(n===1)return one;if(n===2)return two;
 if(n<=10)return grp(n,false)+" "+few;
 if(n===200)return "مائتا "+s;
 return grp(n,false)+" "+((last||n%100===0)?s:many)}
/* noun=true: يتبع الرقم اسم معدود (ريال) مباشرةً */
function words(n,fem,noun){
 if(n===0)return "صفر";
 var b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1000),r=n%1000,p=[];
 if(b)p.push(scale(b,"مليار","ملياران","مليارات","ملياراً","مليار",noun&&!(m||k||r)));
 if(m)p.push(scale(m,"مليون","مليونان","ملايين","مليوناً","مليون",noun&&!(k||r)));
 if(k)p.push(scale(k,"ألف","ألفان","آلاف","ألفاً","ألف",noun&&!r));
 if(r)p.push(grp(r,fem));
 return p.join(" و")}
function rialPhrase(n){
 if(n===1)return "ريال سعودي واحد";
 if(n===2)return "ريالان سعوديان";
 var r=n%100;
 if(r===1||r===2)return words(n-r,false,false)+" و"+rialPhrase(r);
 var w=words(n,false,true);
 if(r>=3&&r<=10)return w+" ريالات سعودية";
 if(r>=11)return w+" ريالاً سعودياً";
 w=w.replace(/(مائتان|ألفان|مليونان|ملياران)$/,function(x){return x.slice(0,-1)});
 return w+" ريال سعودي"}
function halPhrase(q){
 if(q===1)return "هللة واحدة";
 if(q===2)return "هللتان";
 return words(q,true)+(q<=10?" هللات":" هللة")}
function tafqeet(p,q){
 var a=[];if(p)a.push(rialPhrase(p));if(q)a.push(halPhrase(q));
 return a.length?"فقط "+a.join(" و")+" لا غير":""}

/* ===== التاريخ ===== */
function hijri(d){
 try{var o={};
  new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"2-digit",month:"2-digit",year:"numeric"}).formatToParts(d).forEach(function(x){o[x.type]=x.value});
  if(!o.day||!o.month||!o.year)return "";
  return o.day+"/"+o.month+"/"+o.year+" هـ"}catch(e){return ""}}
function gre(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" م"}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){
 var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");
 if(!m)return new Date();
 return new Date(+m[1],+m[2]-1,+m[3],12,0,0)}

/* ===== قراءة الحقول ===== */
function getState(){
 var raw=$("amt").value.replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace(/[٫،]/g,".").replace(/[^0-9.]/g,"");
 var v=parseFloat(raw),ok=isFinite(v)&&v>0&&v<1e9&&!/^\s*[-−–]/.test($("amt").value),p=0,q=0,w="";
 if(ok){var c=Math.round(v*100);p=Math.floor(c/100);q=c%100;w=tafqeet(p,q)}
 var d=parseISO($("vdate").value),h=$("hdate").value.trim();
 var one=function(id){return $(id).value.replace(/\s+/g," ").trim()};
 return {num:one("num")||"1",from:one("from"),ok:ok,p:p,q:q,words:w,note:one("note"),
  cash:one("cash"),bank:one("bank"),cdate:gre(parseISO($("cdate").value||$("vdate").value)),acc:one("acc"),rec:one("rec"),
  hij:h||hijri(d),gre:gre(d),
  amtTxt:ok?p.toLocaleString("en-US"):"",halTxt:ok?pad(q):""}}
function waText(s){
 var a=["سند قبض رقم: "+s.num,"التاريخ: "+s.gre+" — "+s.hij,"","استلمنا من المكرم: "+s.from,
  "مبلغ وقدره: "+(s.ok?s.amtTxt+(s.q?"."+pad(s.q):"")+" ريال سعودي":"")];
 if(s.ok)a.push("("+s.words+")");
 if(s.cash)a.push("نقداً / شيك رقم: "+s.cash);
 if(s.bank)a.push("على بنك: "+s.bank);
 if(s.cdate)a.push("بتاريخ: "+s.cdate);
 if(s.note)a.push("وذلك عن: "+s.note);
 return a.join("\n")}

/* ===== الرسم على اللوحة (وحدة التصميم: 6 وحدات = 1 مم، المقاس 210×148 مم) ===== */
var W=1260,H=888,SC=2,XR=1160,XL=100;
var INK="#111",BLUE="#1a3fa8",RED="#c4161c",GREEN="#1b7a3d";
var cv=$("cv"),cx=cv.getContext("2d");
function fnt(w,z,it){return (it?"italic ":"")+w+" "+z+"px VSans,Tahoma,Arial,sans-serif"}
function tx(c,s,x,y,o){
 c.font=fnt(o.w||400,o.z,o.it);c.fillStyle=o.c||INK;c.textAlign=o.a||"right";c.direction=o.d||"rtl";c.textBaseline="alphabetic";
 c.fillText(s,x,y)}
function mw(c,s,w,z,d,it){c.font=fnt(w,z,it);c.direction=d||"rtl";return c.measureText(s).width}
function dots(c,x1,x2,y){
 if(x2-x1<8)return;
 c.save();c.strokeStyle=INK;c.lineWidth=2;c.lineCap="round";c.setLineDash([0.1,6]);
 c.beginPath();c.moveTo(x2,y);c.lineTo(x1,y);c.stroke();c.restore()}
function rr(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
 c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath()}

/* قيم مكتوبة: تصغير الخط حتى الحد الأدنى ثم قص بنقاط */
function fit1(c,s,maxW,z,min){for(var k=z;k>min;k--){if(mw(c,s,400,k)<=maxW)return k}return min}
function ell(c,s,maxW,z){
 if(mw(c,s,400,z)<=maxW)return s;
 var t=s;while(t.length>1&&mw(c,t+"…",400,z)>maxW)t=t.slice(0,-1);return t+"…"}
/* اتجاه النص المكتوب: لاتيني صرف ⇐ من اليسار، وإلا من اليمين. وتغليف المقاطع اللاتينية داخل نص عربي حتى لا تقفز النقطة */
var AR=/[֐-ࣿיִ-﷿ﹰ-﻿]/;
function dirOf(s){return AR.test(s)?"rtl":"ltr"}
function bd(s){return AR.test(s)?s.replace(/[A-Za-z0-9][A-Za-z0-9 .,\-\/&'()#:+@_]*/g,function(m){var t=m.replace(/\s+$/,"");return "‪"+t+"‬"+m.slice(t.length)}):s}
function typed1(c,s,xR,xL,y,z,min,al){
 if(!s)return;var w=xR-xL,k=fit1(c,s,w,z,min);s=ell(c,s,w,k);
 tx(c,bd(s),al==="c"?(xR+xL)/2:xR,y,{z:k,c:BLUE,a:al==="c"?"center":"right",d:dirOf(s)})}
function wrapL(c,s,ws,z){
 var a=s.split(" "),L=[],cur="",i=0;
 for(var k=0;k<a.length;k++){
  var t=cur?cur+" "+a[k]:a[k];
  if(!cur||mw(c,t,400,z)<=ws[i])cur=t;
  else{L.push(cur);i++;if(i>=ws.length)return null;cur=a[k]}}
 L.push(cur);
 for(i=0;i<L.length;i++)if(mw(c,L[i],400,z)>ws[i])return null;
 return L}
function typedN(c,s,rights,lefts,ys,z,min){
 if(!s)return;
 var ws=rights.map(function(r,i){return r-lefts[i]}),k,L=null;
 for(k=z;k>=min;k--){L=wrapL(c,s,ws,k);if(L)break}
 if(!L){k=min;L=[];var a=s.split(" "),i=0,cur="";
  for(var j=0;j<a.length;j++){var t=cur?cur+" "+a[j]:a[j];
   if(!cur||mw(c,t,400,k)<=ws[i]||i===ws.length-1)cur=t;else{L.push(cur);i++;cur=a[j]}}
  L.push(cur);var n=L.length-1;L[n]=ell(c,L[n],ws[n],k)}
 L.forEach(function(t,i){tx(c,bd(t),rights[i],ys[i],{z:k,c:BLUE,d:dirOf(t)})})}

 var b=stampBox(),a=-stamp.rot*Math.PI/180,dx=p.x-stamp.x,dy=p.y-stamp.y,
 lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
 return Math.abs(lx)<=b.wu/2+10&&Math.abs(ly)<=b.hu/2+10}
function syncStamp(){
 var has=!!stamp.cv;
 $("stSize").value=stamp.w;$("stRot").value=stamp.rot;$("stOpa").value=stamp.opa;$("stBg").value=stamp.bg;$("stOn").checked=stamp.on;
 $("vSize").textContent=stamp.w+" مم";$("vRot").textContent=stamp.rot+"°";$("vOpa").textContent=stamp.opa+"%";$("vBg").textContent=stamp.bg;
 ["stSize","stRot","stOpa","stOn","stDel","stReset"].forEach(function(i){$(i).disabled=!has});
 $("stBg").disabled=!stamp.orig;
 Array.prototype.forEach.call(document.querySelectorAll("#pad button"),function(b){b.disabled=!has});
 updStm()}
function updStm(){cv.classList.toggle("stm",!!stamp.cv&&stamp.on&&$("d2").open)}

/* سحب الختم على السند */
var drag=null;
function ptr(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener("pointerdown",function(e){
 var p=ptr(e);if(!hitStamp(p))return;
 drag={dx:stamp.x-p.x,dy:stamp.y-p.y};try{cv.setPointerCapture(e.pointerId)}catch(x){}
 cv.classList.add("drag");e.preventDefault()});
cv.addEventListener("pointermove",function(e){
 if(!drag)return;var p=ptr(e);
 stamp.x=clamp(p.x+drag.dx,0,W);stamp.y=clamp(p.y+drag.dy,0,H);sched()});
function endDrag(){if(drag){drag=null;cv.classList.remove("drag");saveSet()}}
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);

/* أسهم التحريك (1 مم لكل ضغطة) */
Array.prototype.forEach.call(document.querySelectorAll("#pad button[data-dx]"),function(b){
 var t1,t2,go=function(){stamp.x=clamp(stamp.x+6*(+b.dataset.dx),0,W);stamp.y=clamp(stamp.y+6*(+b.dataset.dy),0,H);sched()},
 stop=function(){clearTimeout(t1);clearInterval(t2);t1=t2=0;saveSet()};
 b.addEventListener("pointerdown",function(e){e.preventDefault();go();t1=setTimeout(function(){t2=setInterval(go,70)},350)});
 ["pointerup","pointerleave","pointercancel"].forEach(function(n){b.addEventListener(n,stop)});
 b.addEventListener("click",function(e){if(e.detail===0){go();saveSet()}})});
$("stReset").onclick=function(){stamp.x=STAMP_SET.x;stamp.y=STAMP_SET.y;stamp.w=STAMP_SET.w;stamp.rot=STAMP_SET.rot;stamp.opa=STAMP_SET.opa;saveSet();syncStamp();render()};
$("stFile").addEventListener("change",function(){var t=this;loadFile(t.files&&t.files[0],function(){try{t.value=""}catch(e){}})});
$("stDel").onclick=function(){if(!confirm("حذف الختم؟"))return;stamp.cv=null;stamp.orig=null;saveStamp();syncStamp();render()};
$("stOn").addEventListener("change",function(){stamp.on=this.checked;saveSet();updStm();render()});
[["stSize","w","vSize"," مم"],["stRot","rot","vRot","°"],["stOpa","opa","vOpa","%"]].forEach(function(a){
 $(a[0]).addEventListener("input",function(){stamp[a[1]]=+this.value;$(a[2]).textContent=this.value+a[3];sched()});
 $(a[0]).addEventListener("change",saveSet)});
var bgT=0;
$("stBg").addEventListener("input",function(){stamp.bg=+this.value;$("vBg").textContent=this.value;
 clearTimeout(bgT);bgT=setTimeout(function(){processStamp();sched()},60)});
$("stBg").addEventListener("change",function(){saveStamp()});
$("d2").addEventListener("toggle",updStm);

/* ===== العرض والتصدير ===== */
var raf=0;
function sched(){if(!raf)raf=requestAnimationFrame(function(){raf=0;render()})}
function render(){
 var s=getState(),c=cx;
 c.setTransform(SC,0,0,SC,0,0);c.globalCompositeOperation="source-over";c.globalAlpha=1;c.setLineDash([]);
 c.fillStyle="#fff";c.fillRect(0,0,W,H);
 header(c,s);form(c,s);drawStamp(c);
 $("wa").href="https://wa.me/?text="+encodeURIComponent(waText(s))}
/* ===== التصدير: صورة / PDF / مشاركة / طباعة ===== */
function b64u8(d){var s=atob(d.split(",")[1]),n=s.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=s.charCodeAt(i);return u}
function fname(e){return "sanad-qabd-"+getState().num+"."+e}
function snap(){render();var du=cv.toDataURL("image/png");return {du:du,blob:new Blob([b64u8(du)],{type:"image/png"})}}
/* PDF حقيقي (A5 أفقي) من صورة JPEG للسند — بدون أي مكتبة */
function makePDF(){
  var jpg=b64u8(cv.toDataURL("image/jpeg",.93)),PW=595.28,PH=419.53,parts=[],len=0,off=[];
  var enc=function(t){var u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i)&255;return u};
  var push=function(u){parts.push(u);len+=u.length};
  var obj=function(n,b){off[n]=len;push(enc(n+" 0 obj\n"+b+"\nendobj\n"))};
  push(enc("%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n"));
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
  var cs="q "+PW+" 0 0 "+PH+" 0 0 cm /Im0 Do Q";
  obj(4,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  off[5]=len;
  push(enc("5 0 obj\n<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n"));
  push(jpg);push(enc("\nendstream\nendobj\n"));
  var xr=len,x="xref\n0 6\n0000000000 65535 f \n";
  for(var i=1;i<=5;i++)x+=("0000000000"+off[i]).slice(-10)+" 00000 n \n";
  push(enc(x+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF"));
  return new Blob(parts,{type:"application/pdf"})}
function blobURL(b){if(blobURL.u)URL.revokeObjectURL(blobURL.u);return blobURL.u=URL.createObjectURL(b)}
var HAS=!!(window.claude&&window.claude.use);
function domSave(b,n){
  var u=blobURL(b),a=document.createElement("a");
  a.href=u;a.download=n;a.style.display="none";document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove()},1500);return u}
function saveFile(b,n){
  if(!HAS)return domSave(b,n);
  window.claude.use("downloads").then(function(d){
   if(!d){domSave(b,n);return}
   return d.save({filename:n,data:b}).then(function(){say("تم الحفظ")}).catch(function(e){
    if(e&&e.code==="declined")return;say("تعذر الحفظ — اضغط مطوّلاً على الصورة واحفظها")})
  }).catch(function(){say("تعذر الحفظ")})}
function showImg(s,go){
  var o=$("out");o.src=s.du;o.style.display="block";$("res").innerHTML="";
  if(go&&o.scrollIntoView)o.scrollIntoView({behavior:"smooth",block:"center"})}
$("img").onclick=function(){
  var s,n=fname("png");
  try{s=snap()}catch(e){say("تعذر إنشاء الصورة");return}
  saveFile(s.blob,n);showImg(s,true);say("تم تنزيل الصورة — لو ما نزلت اضغط مطوّلاً على الصورة واحفظها")};
$("shr").onclick=function(){
  var s,f=null,n=fname("png");
  try{s=snap()}catch(e){say("تعذر إنشاء الصورة");return}
  try{f=new File([s.blob],n,{type:"image/png"})}catch(e){}
  if(!HAS&&f&&navigator.canShare&&navigator.canShare({files:[f]})){
   showImg(s,false);
   navigator.share({files:[f]}).catch(function(e){if(!e||e.name!=="AbortError"){showImg(s,true);say("لم تفتح المشاركة — اضغط مطوّلاً على الصورة واحفظها")}})}
  else{saveFile(s.blob,n);showImg(s,true);say("تم تنزيل الصورة — لو ما نزلت اضغط مطوّلاً على الصورة واحفظها")}};
$("pdf").onclick=function(){
  var b,n=fname("pdf");
  try{render();b=makePDF()}catch(e){say("تعذر إنشاء الـ PDF");return}
  var iosL=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(!HAS&&iosL){var pf=null;try{pf=new File([b],n,{type:"application/pdf"})}catch(e){}
   if(pf&&navigator.canShare&&navigator.canShare({files:[pf]})){
    navigator.share({files:[pf]}).catch(function(e){if(!e||e.name!=="AbortError")saveFile(b,n)});
    say("اختر «حفظ في الملفات» أو أرسله");return}}
  var u=saveFile(b,n),r=$("res"),a=document.createElement("a");
  if(HAS){$("out").style.display="none";r.innerHTML="";return}
  $("out").style.display="none";r.innerHTML="";
  a.className="btn ghost";a.style.display="block";a.style.marginTop="10px";a.href=u;a.target="_blank";a.rel="noopener";
  a.textContent="لو التنزيل ما بدأ: اضغط هنا لفتح الـ PDF";r.appendChild(a);
  if(r.scrollIntoView)r.scrollIntoView({behavior:"smooth",block:"center"});
  say("تم إنشاء الـ PDF")};
if(HAS){$("prn").textContent="طباعة (عبر PDF)";$("prn").onclick=$("pdf").onclick}
else $("prn").onclick=function(){
  render();
  try{window.print();say("لو ما فتحت نافذة الطباعة استخدم «تنزيل PDF»")}
  catch(e){say("الطباعة غير متاحة هنا — استخدم «تنزيل PDF»")}};
$("new").onclick=function(){
 var n=(parseInt($("num").value,10)||0)+1;$("num").value=n;sset("ar_num",String(n));
 ["from","amt","note","cash","bank","cdate","hdate"].forEach(function(i){$(i).value=""});
 $("vdate").value=todayISO();$("out").style.display="none";render();$("from").focus()};
$("num").addEventListener("change",function(){sset("ar_num",$("num").value)});
["from","amt","note","acc","rec","cash","bank","cdate","vdate","hdate","num"].forEach(function(i){
 $(i).addEventListener("input",function(){if(i==="acc"||i==="rec")sset("ar_"+i,this.value);sched()})});

/* ===== البداية ===== */
function fontsReady(){
 var f=document.fonts;if(!f||!f.load)return Promise.resolve();
 return Promise.all(["400","700","italic 700"].map(function(w){return f.load(w+" 20px VSans","أ A 1")})).catch(function(){})}
(function init(){
 $("num").value=parseInt(sget("ar_num"),10)||1;
 $("acc").value=sget("ar_acc")||"";$("rec").value=sget("ar_rec")||"";$("vdate").value=todayISO();
 try{var set=JSON.parse(sget("ar_stset")||"null");
  if(set)["x","y","w","rot","opa","bg"].forEach(function(k){if(typeof set[k]==="number")stamp[k]=set[k]});
  if(set&&typeof set.on==="boolean")stamp.on=set.on}catch(e){}
 render();
 var src=sget("ar_stamp")||STAMP_DEFAULT;
 if(src)loadData(src,function(){syncStamp();render()});else syncStamp();
 fontsReady().then(render);
 window.addEventListener("load",render)})();
if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
